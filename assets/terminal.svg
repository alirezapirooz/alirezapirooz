<svg width="900" height="520"
xmlns="http://www.w3.org/2000/svg">

<style>

text{
    font-family:"Fira Code",monospace;
    fill:#d4d4d4;
    font-size:20px;
}

.small{
    font-family:"Fira Code",monospace;
    fill:#9e9e9e;
    font-size:15px;
}

.bg{
    fill:#1e1e1e;
}

.title{
    fill:#2d2d2d;
}

.red{fill:#ff5f56;}
.yellow{fill:#ffbd2e;}
.green{fill:#27c93f;}

.cursor{
    fill:#27c93f;
}

</style>

<!-- Window -->

<rect
x="20"
y="20"
width="860"
height="480"
rx="12"
ry="12"
class="bg"/>

<!-- Top Bar -->

<rect
x="20"
y="20"
width="860"
height="40"
rx="12"
ry="12"
class="title"/>

<!-- Buttons -->

<circle cx="45" cy="40" r="7" class="red"/>
<circle cx="70" cy="40" r="7" class="yellow"/>
<circle cx="95" cy="40" r="7" class="green"/>

<!-- Title -->

<text
x="450"
y="45"
text-anchor="middle"
class="small">
alireza@github:~
</text>

<!-- Terminal -->

<!-- whoami typing -->

<text x="45" y="90">

<tspan opacity="0">
a
<animate attributeName="opacity"
begin="0s"
dur="0.01s"
fill="freeze"
from="0"
to="1"/>
</tspan>

<tspan opacity="0">
l
<animate attributeName="opacity"
begin="0.05s"
dur="0.01s"
fill="freeze"
from="0"
to="1"/>
</tspan>

<tspan opacity="0">
i
<animate attributeName="opacity"
begin="0.10s"
dur="0.01s"
fill="freeze"
from="0"
to="1"/>
</tspan>

<tspan opacity="0">
r
<animate attributeName="opacity"
begin="0.15s"
dur="0.01s"
fill="freeze"
from="0"
to="1"/>
</tspan>

<tspan opacity="0">
e
<animate attributeName="opacity"
begin="0.20s"
dur="0.01s"
fill="freeze"
from="0"
to="1"/>
</tspan>

<tspan opacity="0">
z
<animate attributeName="opacity"
begin="0.25s"
dur="0.01s"
fill="freeze"
from="0"
to="1"/>
</tspan>

<tspan opacity="0">
a@github:~$ whoami
<animate attributeName="opacity"
begin="0.30s"
dur="0.01s"
fill="freeze"
from="0"
to="1"/>
</tspan>

</text>

<!-- output -->

<text
x="45"
y="120"
opacity="0">

Alireza Pirooz

<animate
attributeName="opacity"
begin="1.4s"
dur="0.2s"
fill="freeze"
from="0"
to="1"/>

</text>

<text x="45" y="165">
alireza@github:~$ pwd
</text>

<text x="45" y="195">
AI Engineer
</text>

<text x="45" y="240">
alireza@github:~$ tree pinned-projects
</text>

<text x="65" y="275">
.
</text>

<text x="65" y="305">
├── book-genre-classifier
</text>

<text x="65" y="330">
├── SQL-Agent
</text>

<text x="65" y="355">
├── digikala_search
</text>

<text x="65" y="380">
├── house-price-regression
</text>

<text x="65" y="405">
├── python-messager
</text>

<text x="65" y="430">
└── AgenticAI-ToolCalling
</text>

<text x="45" y="475">
alireza@github:~$
</text>

<rect
x="260"
y="458"
width="12"
height="22"
fill="#27c93f">

    <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1s"
        repeatCount="indefinite"/>

</rect>

</svg>
