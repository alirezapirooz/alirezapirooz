<svg width="100%" height="100%" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">

  <desc>AI-Dino: a Chrome-Dino-style animated terminal scene for a GitHub README. Pure SVG + SMIL, infinite 6s loop.</desc>

  <defs>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#0d1117"/>
      <path d="M40,0 L0,0 L0,40" fill="none" stroke="#161b22" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.2" fill="#30363d"/>
    </pattern>
    <filter id="dinoGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= WINDOW BACKGROUND ================= -->
  <rect x="0" y="0" width="800" height="400" rx="10" ry="10" fill="url(#gridPattern)" stroke="#30363d" stroke-width="1.5"/>

  <!-- ================= AMBIENT MATRIX DOTS ================= -->
  <circle cx="60" cy="55" r="1.5" fill="#00ff41" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle>
  <circle cx="740" cy="90" r="1.5" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="3.1s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="680" cy="150" r="1.5" fill="#00ff41" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="40" cy="200" r="1.5" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="3.4s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="250" r="1.5" fill="#00ff41" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2.6s" begin="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="30" cy="300" r="1.5" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="3.0s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="45" r="1.5" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2.9s" begin="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="340" r="1.5" fill="#00ff41" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="3.3s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="60" r="1.5" fill="#00ff41" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="720" cy="320" r="1.5" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2.7s" begin="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="350" cy="350" r="1.5" fill="#00ff41" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="3.2s" begin="0.9s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="40" r="1.5" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="770" cy="200" r="1.5" fill="#00ff41" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="3.0s" begin="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="90" r="1.5" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle>
  <circle cx="620" cy="300" r="1.5" fill="#00ff41" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="3.1s" begin="1.7s" repeatCount="indefinite"/></circle>
  <circle cx="80" cy="340" r="1.5" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="2.4s" begin="2.9s" repeatCount="indefinite"/></circle>

  <!-- ================= SCROLLING GROUND ================= -->
  <g font-family="'Fira Code', monospace" font-size="13" fill="#8b949e">
    <g transform="translate(0,0)">
      <animateTransform attributeName="transform" type="translate" values="0;-400" dur="2s" begin="0s" repeatCount="indefinite"/>
      <text x="0" y="320">[root@ai-dino ~]$ ./run_ai_dino.sh _ __ _ _ __ _ _ </text>
      <text x="400" y="320">[root@ai-dino ~]$ ./run_ai_dino.sh _ __ _ _ __ _ _ </text>
    </g>
  </g>
  <line x1="0" y1="326" x2="800" y2="326" stroke="#30363d" stroke-width="1"/>

  <!-- ================= OBSTACLES (loop with the 6s master cycle) ================= -->
  <g transform="translate(800,0)">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="800;800;-200;-200" keyTimes="0;0.083333;0.333333;1" dur="6.0s" begin="0s" repeatCount="indefinite"/>
    <rect x="0" y="280" width="110" height="40" rx="6" fill="#ff5555"/>
    <text x="55" y="305" text-anchor="middle" font-family="'Fira Code', monospace" font-size="16" font-weight="bold" fill="#1a0000">[ BUG ]</text>
  </g>
  <g transform="translate(800,0)">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="800;800;-200;-200" keyTimes="0;0.333333;0.583333;1" dur="6.0s" begin="0s" repeatCount="indefinite"/>
    <rect x="0" y="280" width="170" height="40" rx="6" fill="#f1fa8c"/>
    <text x="85" y="305" text-anchor="middle" font-family="'Fira Code', monospace" font-size="15" font-weight="bold" fill="#1a1a00">⚠ EXCEPTION</text>
  </g>
  <g transform="translate(800,0)">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="800;800;-200;-200" keyTimes="0;0.583333;0.833333;1" dur="6.0s" begin="0s" repeatCount="indefinite"/>
    <rect x="0" y="280" width="140" height="40" rx="6" fill="#8b0000"/>
    <text x="70" y="305" text-anchor="middle" font-family="'Fira Code', monospace" font-size="16" font-weight="bold" fill="#ffffff">💥 CRASH</text>
  </g>

  <!-- ================= DINO (fixed x=100, animates only on y) ================= -->
  <g transform="translate(100,176)">
    <animateTransform attributeName="transform" type="translate" calcMode="linear" values="100,176;100,176;100,60;100,60;100,176;100,176;100,60;100,60;100,176;100,176;100,60;100,60;100,176;100,176" keyTimes="0.0;0.166667;0.2;0.3;0.333333;0.416667;0.45;0.55;0.583333;0.666667;0.7;0.8;0.833333;1" dur="6.0s" begin="0s" repeatCount="indefinite"/>
    <g filter="url(#dinoGlow)">
      <text font-family="'Fira Code', monospace" font-size="18" fill="#00ff41" xml:space="preserve"><tspan x="0" y="20">      __</tspan><tspan x="0" dy="24">     / _)</tspan><tspan x="0" dy="24"> .--^- /</tspan><tspan x="0" dy="24"> \___  /</tspan><tspan x="0" dy="24">   {_}_}</tspan><tspan x="0" dy="24">    || ||</tspan></text>
      <rect x="78" y="58" width="8" height="16" fill="#00ff41">
        <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- ================= HEADER ================= -->
  <text x="15" y="25" font-family="'Fira Code', monospace" font-size="13" fill="#8b949e">AI-Dino v1.0.0</text>
  <text x="785" y="25" text-anchor="end" font-family="'Fira Code', monospace" font-size="13" fill="#8b949e">[alirezapirooz@github ~]$ ./run.sh</text>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#30363d" stroke-width="1"/>

  <!-- ================= SCORE (discrete swaps, synced to the 6s cycle) ================= -->
  <text x="20" y="70" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#58a6ff" opacity="1">Score: 000000<animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0.0;0.25" dur="6.0s" begin="0s" repeatCount="indefinite"/></text>
  <text x="20" y="70" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#58a6ff" opacity="0">Score: 000128<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0;0.25;0.5" dur="6.0s" begin="0s" repeatCount="indefinite"/></text>
  <text x="20" y="70" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#58a6ff" opacity="0">Score: 000312<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0.0;0.5;0.75" dur="6.0s" begin="0s" repeatCount="indefinite"/></text>
  <text x="20" y="70" font-family="'Fira Code', monospace" font-size="18" font-weight="bold" fill="#58a6ff" opacity="0">Score: 000548<animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0.0;0.75" dur="6.0s" begin="0s" repeatCount="indefinite"/></text>

  <!-- ================= HIGH SCORE POPUP (fades in/out near end of cycle) ================= -->
  <g opacity="0">
    <animate attributeName="opacity" calcMode="linear" values="0;0;0.95;0.95;0" keyTimes="0.0;0.85;0.883333;0.983333;1" dur="6.0s" begin="0s" repeatCount="indefinite"/>
    <rect x="250" y="140" width="300" height="80" rx="8" fill="#1f6feb"/>
    <text x="400" y="172" text-anchor="middle" font-family="'Fira Code', monospace" font-size="17" font-weight="bold" fill="#ffffff">High Score:</text>
    <text x="400" y="198" text-anchor="middle" font-family="'Fira Code', monospace" font-size="15" fill="#e6f0ff">Keep Learning</text>
  </g>

</svg>
